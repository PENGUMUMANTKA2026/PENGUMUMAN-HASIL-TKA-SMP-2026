<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pengumuman Hasil TKA SMP 2026</title>

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0d6efd, #3d8bfd, #6ea8fe);
    margin: 0;
}

/* HEADER */
.header {
    text-align: center;
    color: white;
    padding: 40px 20px;
}

.header h1 {
    margin: 0;
    font-size: 26px;
}

.header p {
    opacity: 0.9;
}

/* CARD */
.container {
    background: white;
    max-width: 420px;
    margin: -30px auto 30px;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    text-align: center;
    animation: fadeIn 1s ease;
}

/* INPUT */
input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    margin-top: 15px;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 8px rgba(13,110,253,0.4);
}

/* BUTTON */
button {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #0d6efd, #6610f2);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

button:hover {
    transform: translateY(-2px) scale(1.03);
}

/* HASIL */
#hasil {
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    background: #f1f5f9;
    display: none;
    animation: fadeIn 0.5s ease;
}

.lulus {
    color: #198754;
    font-size: 18px;
    font-weight: bold;
}

.gagal {
    color: #dc3545;
    font-size: 18px;
    font-weight: bold;
}

/* FOTO */
#fotoHasil img {
    width: 100%;
    border-radius: 15px;
    margin-top: 15px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    animation: zoomIn 0.5s ease;
}

/* FOOTER */
.footer {
    text-align: center;
    color: white;
    font-size: 12px;
    margin-bottom: 20px;
}

/* COPYRIGHT KIRI BAWAH */
.copyright {
    position: fixed;
    bottom: 10px;
    left: 10px;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
}

/* ANIMASI */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(15px);}
    to {opacity: 1; transform: translateY(0);}
}

@keyframes zoomIn {
    from {transform: scale(0.8); opacity: 0;}
    to {transform: scale(1); opacity: 1;}
}
</style>
</head>

<body>

<div class="header">
    <h1>Pengumuman Hasil TKA SMP 2026</h1>
    <p>Kementerian Pendidikan, Kebudayaan</p>
</div>

<div class="container">
    <h3>Cek Kelulusan</h3>

    <input type="text" id="nama" placeholder="Masukkan Nama Peserta">
    <button onclick="cekHasil()">CEK HASIL</button>

    <div id="hasil"></div>
    <div id="fotoHasil"></div>
</div>

<div class="footer">
    © 2026 Panitia TKA SMP
</div>

<!-- COPYRIGHT KIRI BAWAH -->
<div class="copyright">
    © wisnujr
</div>

<!-- AUDIO -->
<audio id="soundKlik" src="klik.mp3"></audio>

<script>
function cekHasil() {
    let nama = document.getElementById("nama").value;
    let hasil = document.getElementById("hasil");
    let foto = document.getElementById("fotoHasil");
    let klik = document.getElementById("soundKlik");

    klik.play();
    if (navigator.vibrate) navigator.vibrate(200);

    if (nama.trim() === "") {
        hasil.style.display = "block";
        hasil.innerHTML = "Silakan masukkan nama!";
        foto.innerHTML = "";
    } else {
        hasil.style.display = "block";
        hasil.innerHTML = "⏳ Memproses data...";
        foto.innerHTML = "";

        setTimeout(() => {
            let lulus = Math.random() > 0.5;

            if (lulus) {
                hasil.innerHTML = `
                    <b>${nama}</b><br>
                    <span class="lulus">LULUS 🎉</span>
                `;
            } else {
                hasil.innerHTML = `
                    <b>${nama}</b><br>
                    <span class="gagal">TIDAK LULUS ❌</span>
                `;
            }

            let randomFoto = Math.floor(Math.random() * 6) + 1;
            foto.innerHTML = `<img src="foto${randomFoto}.png">`;

        }, 2000);
    }
}
</script>

</body>
</html>
